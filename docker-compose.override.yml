services:
  backend:
    image: node:lts
    working_dir: /app
    command:
      - sh
      - -c
      - |
        npm ci --include-workspace-root --workspace @bmad-todo/backend
        exec npx tsx --watch apps/backend/src/server.ts
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/backend/node_modules
    environment:
      LOG_LEVEL: debug

  frontend:
    image: node:lts
    working_dir: /app/apps/frontend
    command:
      - sh
      - -c
      - |
        cd /app && npm ci --include-workspace-root --workspace @bmad-todo/frontend
        cd /app/apps/frontend && exec npx vite --host 0.0.0.0 --port 5173
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/frontend/node_modules
